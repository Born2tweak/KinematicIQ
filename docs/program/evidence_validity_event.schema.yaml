$schema: https://json-schema.org/draft/2020-12/schema
$id: https://kinematiciq.local/schemas/evidence-validity-event-v1.schema.yaml
type: object
additionalProperties: false
required:
  - event_id
  - milestone_id
  - evidence_id
  - from
  - to
  - trigger
  - rationale
  - affected_scope
  - recorded_at
properties:
  event_id: {type: string, pattern: '^VAL-[A-Z0-9-]+$'}
  milestone_id: {type: string, pattern: '^KQ-[0-9]{3}$'}
  evidence_id: {type: string}
  replacement_evidence_id: {type: string}
  from:
    enum: [null, Current, ReverificationRequired, Invalidated, Superseded, Retired]
  to:
    enum: [Current, ReverificationRequired, Invalidated, Superseded, Retired]
  trigger: {type: string, minLength: 4}
  rationale: {type: string, minLength: 20}
  affected_scope: {type: array, minItems: 1, items: {type: string}}
  recorded_at: {type: string, format: date-time}
