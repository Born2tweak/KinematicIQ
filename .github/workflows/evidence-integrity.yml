name: evidence-integrity

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements-program.txt
      - run: npm --prefix web ci
      - run: python -m unittest discover -s tests/program -p "test_*.py" -v
      - run: python tools/program/transition_wave.py --verify
      - run: python tools/program/compile_evidence_validity.py --verify
      - run: python tools/program/verify_evidence.py --all
      - run: python tools/program/compile_status.py --verify --output docs/status/program_status.json
      - run: python tools/program/generate_checkpoint.py --verify --output docs/status/program_checkpoint.json
      - run: npm --prefix web test -- --run --reporter=dot
      - run: npm --prefix web run build
      - name: Require clean tracked and untracked state
        shell: bash
        run: test -z "$(git status --porcelain --untracked-files=all)"
